[package]
name = "rt-voice-wasm"
version = "0.1.0"
edition = "2021"
description = "Real-time audio transcription using Whisper.cpp via WASM"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "AudioContext",
    "AudioWorkletNode",
    "MediaStream",
    "MediaStreamAudioSourceNode",
    "Window",
    "Navigator",
    "console",
] }
wasm-bindgen-futures = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
cc = "1"
bindgen = "0.71"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]

[dev-dependencies]
wasm-bindgen-test = "0.3"

[profile.release]
opt-level = 3
lto = true
