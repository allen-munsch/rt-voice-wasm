[package]
name = "rt-voice-wasm"
version = "0.1.0"
edition = "2021"
description = "Real-time audio transcription using Whisper.cpp via WASM"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "rt-voice-server"
path = "src/bin/server.rs"

[[bin]]
name = "ws-send"
path = "src/bin/ws_send.rs"

[[bin]]
name = "live-captions"
path = "src/bin/live_captions.rs"
required-features = ["mic-capture"]

[features]
default = ["native-cpu"]
native-cpu = []
mic-capture = ["dep:cpal"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "AudioContext",
    "AudioWorkletNode",
    "MediaStream",
    "MediaStreamAudioSourceNode",
    "Window",
    "Navigator",
    "console",
] }
wasm-bindgen-futures = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
toml = "0.8"

[build-dependencies]
cc = "1"
bindgen = "0.71"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
cpal = { version = "0.15", optional = true }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.24"
libloading = "0.8"
futures-util = "0.3"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]

[dev-dependencies]
wasm-bindgen-test = "0.3"

[package.metadata.deb]
maintainer = "James Munsch <james.a.munsch@gmail.com>"
section = "sound"
priority = "optional"
depends = "libasound2 | libasound2t64"
assets = [
    ["models/ggml-tiny.en-q5_1.bin", "/usr/share/rt-voice-wasm/models/", "644"],
    ["target/release/live-captions", "/usr/bin/live-captions", "755"],
]
extended-description = """\
Real-time speech-to-text captions for desktop accessibility.

Captures from the default microphone, transcribes via Moonshine,
and emits JSON-lines captions to stdout.

Headless e2e testing: live-captions --wav-file test.wav"""

[profile.release]
opt-level = 3
lto = true
