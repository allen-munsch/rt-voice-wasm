<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Whisper WASM Real-time Transcription</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 800px; margin: 2rem auto; padding: 0 1rem; }
    #status { color: #666; font-size: 0.9rem; }
    #transcript { min-height: 200px; border: 1px solid #ccc; border-radius: 6px; padding: 1rem; margin: 1rem 0; white-space: pre-wrap; font-size: 1.1rem; }
    button { padding: 0.6rem 1.2rem; font-size: 1rem; margin-right: 0.5rem; border-radius: 4px; border: 1px solid #888; cursor: pointer; background: #f5f5f5; }
    button:disabled { opacity: 0.5; cursor: default; }
    button.primary { background: #1a73e8; color: white; border-color: #1a73e8; }
    #progress-bar { width: 100%; height: 8px; background: #eee; border-radius: 4px; margin: 0.5rem 0; overflow: hidden; }
    #progress-fill { width: 0%; height: 100%; background: #1a73e8; transition: width 0.2s; }
    #metrics { font-size: 0.85rem; color: #555; margin-top: 0.5rem; }
  </style>
</head>
<body>
  <h1>Whisper WASM — Real-time Transcription</h1>
  <div id="status">Initializing...</div>
  <div id="progress-bar"><div id="progress-fill"></div></div>
  <div id="transcript"></div>
  <div>
    <button id="btn-start" class="primary" disabled>Start Mic</button>
    <button id="btn-stop" disabled>Stop</button>
    <button id="btn-clear">Clear</button>
  </div>
  <div id="metrics"></div>
  <script type="module" src="main.js"></script>
</body>
</html>
